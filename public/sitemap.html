<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Map | Socio Maverick</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #111827;
        --muted: #4b5563;
        --accent: #0f766e;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top left, #ccfbf1 0%, var(--bg) 35%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }

      a {
        display: block;
        text-decoration: none;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        color: var(--accent);
        background: #ffffff;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      a:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(15, 118, 110, 0.15);
      }

      small {
        display: block;
        margin-top: 18px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Socio Maverick - Site Map</h1>
      <p>Quick links to all public pages.</p>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/work">Work</a></li>
        <li><a href="/services">Services</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
      <small>XML sitemap: <a href="/sitemap.xml">/sitemap.xml</a></small>
    </main>
  </body>
</html>
